name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ubuntu's apt package (1.9.8 as of 24.04) mis-parses this codebase's C++20 concept-constrained
  # templates and reports hundreds of false "undocumented" warnings across whole classes (verified:
  # 1.9.8/1.10.0/1.12.0 all produce 200+ false positives, 1.13.2 produces 0, matching local dev
  # environments' modern Doxygen). Pin a real release instead of relying on the distro package.
  DOXYGEN_VERSION: "1.13.2"
  # Ubuntu's apt package (18 as of 24.04) predates .clang-format's BreakTemplateDeclarations key
  # and fails to even parse the config file. Match local dev's clang-format (22.x) via LLVM's own
  # apt repo instead of the distro package.
  LLVM_VERSION: "22"

jobs:
  build-test-lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build/lint toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lcov

      - name: Install pinned clang-format ${{ env.LLVM_VERSION }}
        # update-alternatives isn't used here: the runner image already registers its own
        # clang-format alternative (observed to win regardless of priority/--install). Instead,
        # symlink into a fresh directory prepended to PATH, so it's found first unambiguously.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main"
          sudo apt-get update
          sudo apt-get install -y "clang-format-${LLVM_VERSION}"
          mkdir -p "$HOME/.local/pinned-bin"
          ln -sf "/usr/bin/clang-format-${LLVM_VERSION}" "$HOME/.local/pinned-bin/clang-format"
          echo "$HOME/.local/pinned-bin" >> "$GITHUB_PATH"

      - name: Install pinned Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          curl -sL "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" -o doxygen.tar.gz
          tar -xzf doxygen.tar.gz
          echo "$PWD/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install documentation toolchain
        run: pip install -r requirements-docs.txt

      - name: Install Python test toolchain
        run: pip install -r python/requirements-test.txt

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGECKO_BUILD_PYTHON=ON

      - name: Build
        # -j2: the standard GitHub-hosted runner has 2 cores/7GB RAM; Ninja's default (nproc) can
        # schedule enough concurrent heavy CGAL/Boost-template compiles (block/tst in particular) to
        # exceed that and get cc1plus OOM-killed.
        run: cmake --build build -j2

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Lint (format, Doxygen completeness, Markdown format)
        run: cmake --build build --target lint

      - name: Build documentation site
        run: cmake --build build --target docs

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build/coverage toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lcov

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python test toolchain
        run: pip install -r python/requirements-test.txt

      - name: Configure (coverage)
        # GECKO_CODE_COVERAGE_HTML_REPORT (not just GECKO_CODE_COVERAGE) is what actually defines
        # the code_cover_gecko target (see testing.md); the HTML output itself is unused here.
        # GECKO_BUILD_PYTHON=ON: python/src/bindings.cpp inherits the same --coverage instrumentation
        # as the rest of the library, and test_python (run as part of ctest below) exercises it, so
        # this one report covers the C++ library, the bindings, and everything the Python tests
        # reach through them — no separate Python coverage tooling needed.
        run: cmake -S . -B build-coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGECKO_CODE_COVERAGE_HTML_REPORT=ON -DGECKO_BUILD_PYTHON=ON

      - name: Build
        run: cmake --build build-coverage -j2

      - name: Generate coverage report
        run: cmake --build build-coverage --target code_cover_gecko

      - name: Filter out vendored/test/data paths
        # code_cover_gecko.info is the *unfiltered* lcov capture: CodeCoverage.cmake's own
        # COVERAGE_LCOV_EXCLUDES filtering step writes a separate .info.cleaned file that only
        # feeds genhtml and is then deleted, never overwriting the file it advertises as the
        # "saved" report. Apply the same exclusions ourselves before uploading.
        run: |
          lcov --remove build-coverage/code_cover_gecko.info \
            '/usr/*' '*/external/*' '*/test_data/*' '*/tst/*' '*/docs/*' \
            --output-file build-coverage/coverage.filtered.info \
            --ignore-errors unused

      - name: Upload to Codecov
        # No token: the Codecov GitHub App is installed on this repo, which authenticates the
        # upload on its own — a static CODECOV_TOKEN secret isn't needed (and repeatedly rejected
        # as "Repository not found" when one was supplied, since it wasn't actually required).
        uses: codecov/codecov-action@v7
        with:
          files: build-coverage/coverage.filtered.info
          fail_ci_if_error: true
