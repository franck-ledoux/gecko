name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build/lint/doc toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-format doxygen lcov

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install documentation toolchain
        run: pip install -r requirements-docs.txt

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Lint (format, Doxygen completeness, Markdown format)
        run: cmake --build build --target lint

      - name: Build documentation site
        run: cmake --build build --target docs
