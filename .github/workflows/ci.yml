name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ubuntu's apt package (1.9.8 as of 24.04) mis-parses this codebase's C++20 concept-constrained
  # templates and reports hundreds of false "undocumented" warnings across whole classes (verified:
  # 1.9.8/1.10.0/1.12.0 all produce 200+ false positives, 1.13.2 produces 0, matching local dev
  # environments' modern Doxygen). Pin a real release instead of relying on the distro package.
  DOXYGEN_VERSION: "1.13.2"
  # Ubuntu's apt package (18 as of 24.04) predates .clang-format's BreakTemplateDeclarations key
  # and fails to even parse the config file. Match local dev's clang-format (22.x) via LLVM's own
  # apt repo instead of the distro package.
  LLVM_VERSION: "22"

jobs:
  # Compiles and runs the full test suite (incl. the Python bindings, via ctest -> pytest) on all
  # 3 major platforms. Every dependency is either vendored header-only (CGAL/Boost/Eigen/json) or
  # built from source in-tree (Catch2, pybind11), so no OS package manager is needed for the C++
  # side at all — only Ninja itself (already present on windows-latest via MSVC's generator, no
  # separate install needed there).
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            generator: Ninja
          - os: macos-latest
            generator: Ninja
          - os: windows-latest
            # No Ninja install step needed: windows-latest ships MSBuild/VS2022 already, so the
            # native multi-config generator avoids an extra toolchain-install step and any
            # vcvars/Developer-Prompt environment dance that Ninja+cl.exe would require.
            generator: "Visual Studio 17 2022"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python test toolchain
        run: pip install -r python/requirements-test.txt

      - name: Configure
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Debug -DGECKO_BUILD_PYTHON=ON

      - name: Build
        # --parallel 2: the standard GitHub-hosted runners are 2-core/7GB RAM; unbounded
        # parallelism can schedule enough concurrent heavy CGAL/Boost-template compiles
        # (block/tst in particular) to exceed that and get the compiler OOM-killed (verified on
        # Linux/GCC; kept conservative here across all 3 platforms for the same reason).
        # --config Debug is a no-op for single-config generators (Ninja) and selects the Debug
        # configuration for the multi-config Visual Studio generator.
        run: cmake --build build --config Debug --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Debug

  # Runs clang-format/Doxygen-completeness/mdformat checks and builds the MkDocs site. These
  # targets operate purely on source files via external tools (clang-format, doxygen, mkdocs) —
  # verified locally that none of them need the project actually compiled first — so this job
  # only configures CMake (to register the targets) and never builds the library/tests, and stays
  # Linux-only: the tooling here is pinned to specific Linux binaries/packages, and there's no
  # value in running the same source-level checks redundantly on every platform.
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install pinned clang-format ${{ env.LLVM_VERSION }}
        # update-alternatives isn't used here: the runner image already registers its own
        # clang-format alternative (observed to win regardless of priority/--install). Instead,
        # symlink into a fresh directory prepended to PATH, so it's found first unambiguously.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main"
          sudo apt-get update
          sudo apt-get install -y "clang-format-${LLVM_VERSION}"
          mkdir -p "$HOME/.local/pinned-bin"
          ln -sf "/usr/bin/clang-format-${LLVM_VERSION}" "$HOME/.local/pinned-bin/clang-format"
          echo "$HOME/.local/pinned-bin" >> "$GITHUB_PATH"

      - name: Install pinned Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          curl -sL "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" -o doxygen.tar.gz
          tar -xzf doxygen.tar.gz
          echo "$PWD/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install documentation toolchain
        run: pip install -r requirements-docs.txt

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Lint (format, Doxygen completeness, Markdown format)
        run: cmake --build build --target lint

      - name: Build documentation site
        run: cmake --build build --target docs
